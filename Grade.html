<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Grade Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8f5e9;
            text-align: center;
            padding: 20px;
        }

        .container {
            background-color: white;
            width: 350px;
            max-width: 100%;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-sizing: border-box;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            color: green;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background-color: green;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: darkgreen;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Grade Calculator</h2>

        <form id="gradeForm">

            <input type="number" id="m1"
                   placeholder="Subject 1 Marks"
                   min="0" max="100" step="any" required>

            <input type="number" id="m2"
                   placeholder="Subject 2 Marks"
                   min="0" max="100" step="any" required>

            <input type="number" id="m3"
                   placeholder="Subject 3 Marks"
                   min="0" max="100" step="any" required>

            <input type="number" id="m4"
                   placeholder="Subject 4 Marks"
                   min="0" max="100" step="any" required>

            <input type="number" id="m5"
                   placeholder="Subject 5 Marks"
                   min="0" max="100" step="any" required>

            <br><br>

            <button type="submit">Calculate Grade</button>

        </form>

        <div id="result"></div>

    </div>

    <script>
        document.getElementById("gradeForm")
            .addEventListener("submit", function(event) {

            event.preventDefault();

            let m1 = Number(document.getElementById("m1").value);
            let m2 = Number(document.getElementById("m2").value);
            let m3 = Number(document.getElementById("m3").value);
            let m4 = Number(document.getElementById("m4").value);
            let m5 = Number(document.getElementById("m5").value);

            let result = document.getElementById("result");

            // Validate marks
            let marks = [m1, m2, m3, m4, m5];

            for (let mark of marks) {
                if (mark < 0 || mark > 100) {
                    result.innerHTML =
                        "Please enter marks between 0 and 100.";
                    return;
                }
            }

            // Calculate total and average
            let total = m1 + m2 + m3 + m4 + m5;
            let average = total / 5;

            // Calculate grade
            let grade;

            if (average >= 90) {
                grade = "A+";
            } else if (average >= 80) {
                grade = "A";
            } else if (average >= 70) {
                grade = "B";
            } else if (average >= 60) {
                grade = "C";
            } else if (average >= 50) {
                grade = "D";
            } else {
                grade = "F";
            }

            // Display result
            result.innerHTML =
                "Total Marks: " + total + " / 500<br>" +
                "Average: " + average.toFixed(2) + "%<br>" +
                "Grade: " + grade;

        });
    </script>

</body>
</html>
